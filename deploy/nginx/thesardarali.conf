# Sardar Ali - thesardarali.com on root@oc (/etc/nginx/conf.d/thesardarali.conf)
# Static frontend from /var/www/alibaba/front-end, bun API on :4400.
# Page requests go through the API (/_page/*) so each route gets its own
# title/description/canonical/JSON-LD; assets are served straight from disk.

# Canonical host is the apex: www and the old preview domain redirect to it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thesardarali.com;
    ssl_certificate /etc/letsencrypt/live/thesardarali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesardarali.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://thesardarali.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alibaba.com.u4.lol;
    ssl_certificate /etc/letsencrypt/live/alibaba.com.u4.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alibaba.com.u4.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://thesardarali.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thesardarali.com www.thesardarali.com alibaba.com.u4.lol;
    return 301 https://thesardarali.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thesardarali.com;

    ssl_certificate /etc/letsencrypt/live/thesardarali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesardarali.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/alibaba/front-end;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
    }

    # Hashed build output: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never serve the raw template directly; pages come from the renderer.
    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri @page;
    }

    location @page {
        rewrite ^ /_page$uri break;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        # API down: still serve the app shell rather than an error page.
        error_page 502 503 504 = @shell;
    }

    location @shell {
        add_header Cache-Control "no-cache";
        try_files /index.html =503;
    }
}
